<style>
/*
  Seans v3 — cam / blur, minimal
  1920×1080 ölçeği: 1rem = 16px.
  Cam etkisi canlı backdrop-filter DEĞİL: her fotoğrafın bulanık kopyası bir kez (canvas ile) üretilir,
  cam panellerin içine sahneyle hizalı biçimde yerleştirilir. Zayıf GPU'da kare düşürmez.
*/
:root{
  --w:#fff;
  --w-80:rgba(255,255,255,.82);
  --w-55:rgba(255,255,255,.55);
  --w-35:rgba(255,255,255,.35);
  --font:"Jost", "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
  --spring:cubic-bezier(.3,1.3,.45,1);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(100vw / 120);background:#000}
@media (min-aspect-ratio:16/9){html{font-size:calc(100vh / 67.5)}}
body{width:100vw;height:100vh;overflow:hidden;background:#000;color:var(--w);font-family:var(--font);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:120rem;height:67.5rem;transform:translate(-50%,-50%);overflow:hidden}

/* ---------- Fotoğraf ---------- */
.ph{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2.2s ease}
.ph.on{opacity:1}
#shade{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 70rem 34rem at 50% 30%, rgba(0,0,0,.28), rgba(0,0,0,0) 70%),
  linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,0) 40%, rgba(0,0,0,.35) 100%)}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}

/* ---------- Cam ---------- */
.glass{position:absolute;overflow:hidden;border-radius:2.4rem;
  box-shadow:0 2.4rem 5rem rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.12)}
.frost{position:absolute;width:120rem;height:67.5rem;pointer-events:none}
.frost .fb{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2.2s ease}
.frost .fb.on{opacity:1}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04) 45%, rgba(20,20,24,.10))}
.glass > .in{position:relative;z-index:2}

/* ---------- Saat ---------- */
#time{position:absolute;left:0;right:0;top:11rem;text-align:center;transition:transform 1.4s var(--ease)}
#clock{font-weight:200;font-size:15rem;line-height:1;letter-spacing:-.01em;font-feature-settings:"tnum" 1;text-shadow:0 .4rem 3rem rgba(0,0,0,.18)}
#meta{margin-top:1.4rem;display:flex;justify-content:center;align-items:center;gap:2rem;font-size:1.7rem;font-weight:400;letter-spacing:.04em;color:var(--w-80)}
#meta .rule{width:1px;height:1.5rem;background:var(--w-35)}
#meta svg{width:1.9rem;height:1.9rem;margin-right:.7rem;vertical-align:-.35rem;stroke:var(--w-80);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
body.idle #time{transform:translateY(8rem)}

/* ---------- Dikey / kare fotoğraf: bulanık zemin + çerçeveli fotoğraf ---------- */
#card{position:absolute;right:8rem;top:6rem;height:46rem;width:34.5rem;border-radius:2.2rem;overflow:hidden;opacity:0;transform:scale(.97);
  transition:opacity 1.8s var(--ease), transform 1.8s var(--ease), width 1.2s var(--ease);
  box-shadow:0 3rem 7rem rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.16)}
#card .cv{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.8s ease}
#card .cv.on{opacity:1}
#card::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);pointer-events:none}
body.portrait #card{opacity:1;transform:none}
body.portrait #time{left:8rem;right:auto;text-align:left;top:15rem}
body.portrait #meta{justify-content:flex-start}
#veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.8s}
body.portrait #veil{opacity:.22}
body.portrait.idle #time{transform:translateY(6rem)}
body.portrait #caption{left:auto;right:8rem;width:34.5rem}

/* ---------- Dock ---------- */
#dock{left:50%;bottom:5.5rem;transform:translateX(-50%);border-radius:2.8rem;transition:opacity .9s var(--ease), transform .9s var(--ease)}
#dock .lb{display:none}
#dock .in{display:flex;align-items:center;gap:1.3rem;padding:1.4rem}
body.idle #dock{opacity:0;transform:translate(-50%,3rem)}
.it{position:relative;flex:none}
.tl{width:6.2rem;height:6.2rem;border-radius:1.7rem;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
  display:flex;align-items:center;justify-content:center;transition:transform .45s var(--spring), background-color .3s, box-shadow .3s}
.tl .g{font-weight:300;font-size:2.7rem;line-height:1;color:var(--w);transition:color .3s}
.tl svg{width:2.4rem;height:2.4rem;stroke:var(--w);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.tl img{width:100%;height:100%;border-radius:inherit;object-fit:cover}
.lb{position:absolute;left:50%;bottom:calc(100% + 2.6rem);transform:translate(-50%,.5rem);white-space:nowrap;
  font-size:1.35rem;font-weight:400;letter-spacing:.05em;opacity:0;transition:opacity .25s, transform .35s var(--ease);text-shadow:0 .2rem 1.2rem rgba(0,0,0,.35)}
.it.focus .tl{transform:translateY(-.5rem) scale(1.13);background:rgba(255,255,255,.94);box-shadow:0 1.2rem 2.4rem rgba(0,0,0,.25)}
.it.focus .tl .g{color:#17171a}
.it.focus .tl svg{stroke:#17171a}
.it.focus .lb{opacity:1;transform:translate(-50%,0)}
#dlabel{position:absolute;transform:translateX(-50%);white-space:nowrap;font-size:1.4rem;font-weight:400;letter-spacing:.06em;text-shadow:0 .2rem 1.2rem rgba(0,0,0,.4);opacity:0;transition:opacity .3s, left .35s var(--ease);pointer-events:none}
#dlabel.on{opacity:1}
body.idle #dlabel{opacity:0}
.div{width:1px;height:3.6rem;background:rgba(255,255,255,.18);margin:0 .4rem}
body.edit .it .tl{box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
body.edit .it.picked .tl{transform:translateY(-1.4rem) scale(1.13)}
@keyframes sway{0%,100%{rotate:-1.6deg}50%{rotate:1.6deg}}
body.edit .it.picked .tl{animation:sway .3s ease-in-out infinite}

/* ---------- Alt satırlar ---------- */
#caption{position:absolute;left:0;right:0;bottom:4.5rem;text-align:center;font-size:1.4rem;letter-spacing:.06em;color:var(--w-55);opacity:0;transition:opacity 1.2s}
body.idle #caption{opacity:1}
#hint{position:absolute;right:4rem;bottom:2.2rem;display:none;gap:1.4rem;font-size:1.05rem;letter-spacing:.03em;color:var(--w-35);transition:opacity .9s}
#hint b{font-weight:500;color:var(--w-55);margin-right:.3rem}
body.preview #hint{display:flex}
body.idle #hint{opacity:0}

/* ---------- Bildirim ---------- */
#toast{left:50%;top:3.6rem;transform:translate(-50%,-1.2rem);border-radius:99rem;opacity:0;transition:opacity .35s, transform .5s var(--spring);pointer-events:none}
#toast .in{padding:1rem 2.2rem;font-size:1.35rem;letter-spacing:.03em}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Paneller ---------- */
.panel{opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.panel.on{opacity:1;pointer-events:auto}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .45s}
#scrim.on{opacity:1}
.panel h2{font-weight:300;font-size:2.8rem;letter-spacing:.01em}
.panel .sub{margin-top:.5rem;font-size:1.3rem;letter-spacing:.03em;color:var(--w-55)}

#all{left:8rem;right:8rem;top:7rem;bottom:7rem;border-radius:3.2rem}
#all .in{padding:4.4rem 5rem}
#grid{margin-top:3.8rem;display:grid;grid-template-columns:repeat(8, 6.2rem);justify-content:space-between;row-gap:5.4rem}
#grid .it{width:6.2rem}
#grid .lb{bottom:auto;top:7.6rem;font-size:1.15rem;opacity:.6;transform:translate(-50%,0);max-width:9rem;overflow:hidden;text-overflow:ellipsis}
#grid .it.focus .lb{opacity:1}
.pin{position:absolute;top:-.6rem;right:-.6rem;width:2rem;height:2rem;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 .4rem 1rem rgba(0,0,0,.3)}
.pin svg{width:1.2rem;height:1.2rem;stroke:#17171a;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.it.focus .pin{background:#17171a}
.it.focus .pin svg{stroke:#fff}
body.picking #grid .it:not(.on) .tl{opacity:.55}
body.picking #grid .it.focus .tl{opacity:1}

#settings{right:4rem;top:4rem;bottom:4rem;width:46rem;border-radius:3.2rem}
#settings .in{padding:4.4rem 3.6rem 2.4rem;height:100%;display:flex;flex-direction:column}
#rowsWrap{position:relative;flex:1;min-height:0;margin-top:2.6rem;overflow:hidden;padding:.6rem .4rem;margin-left:-.4rem;margin-right:-.4rem}
#rows{transition:transform .35s var(--ease)}
#rowsWrap{-webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 1.4rem, #000 calc(100% - 1.4rem), transparent 100%);mask-image:linear-gradient(to bottom, transparent 0, #000 1.4rem, #000 calc(100% - 1.4rem), transparent 100%)}
.grp{margin:2.2rem 0 .8rem 1.6rem;font-size:1.15rem;letter-spacing:.06em;color:var(--w-35)}
.grp:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;align-items:center;height:4.6rem;padding:0 1.6rem;border-radius:1.4rem;font-size:1.45rem;letter-spacing:.02em;transition:background-color .2s, color .2s, transform .35s var(--spring)}
.row .v{color:var(--w-55);display:flex;align-items:center;gap:.9rem}
.row .ar{opacity:0;font-size:1rem}
.row.focus{background:rgba(255,255,255,.94);color:#17171a;transform:scale(1.02)}
.row.focus .v{color:rgba(23,23,26,.6)}
.row.focus .ar{opacity:.6}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}

function makeBlur(sc, cb){
  if(sc.blur) return cb(sc.blur);
  var img = new Image();
  img.onload = function(){
    var W = 240, H = 135, c = document.createElement("canvas"); c.width = W; c.height = H;
    var x = c.getContext("2d"), iw = img.naturalWidth || 1920, ih = img.naturalHeight || 1080;

    var s = Math.max((W+40)/iw, (H+40)/ih), dw = iw*s, dh = ih*s;

    cb(sc.blur);
  };

function renderGrid(){
  document.querySelector("#all h2").textContent = picking ? "Alt şeridi seç" : "Uygulamalar";
  document.querySelector("#all .sub").textContent = picking
    ? "OK ile alt şeride ekle ya da çıkar. Bitirince Geri tuşuna bas."
    : "OK'ye uzun basarak uygulamayı alt şeride ekleyebilir ya da çıkarabilirsin";
  document.body.classList.toggle("picking", picking);
  document.getElementById("grid").innerHTML = apps.map(function(a, i){
    var on = S.dock.indexOf(a.pkg) > -1;
    return '<div class="it'+(on?' on':'')+'" data-i="'+i+'">'+tileHTML(a).replace('<div class="tl">','<div class="tl" style="position:relative">'+(on?'<i class="pin">'+CHECK+'</i>':''))+'</div>';
  }).join(""); paint();
}
function togglePin(i){
  var a = apps[i], j = S.dock.indexOf(a.pkg);
  if(j > -1){ S.dock.splice(j,1); toast(a.label + " alt şeritten çıkarıldı"); } else { S.dock.push(a.pkg); toast(a.label + " alt şeride eklendi"); }
  save(); renderGrid();
}
var ROWS = [
  {grp:"Alt şerit"},
  {act:"pick", label:"Alt şeride uygulama seç"},
  {act:"edit", label:"Alt şeridin sırasını değiştir"},
  {key:"icons", label:"Simgeler", opts:[["mono","Sade"],["app","Uygulama simgesi"]]},
  {grp:"Arka plan"},
  {key:"interval", label:"Fotoğraf değişimi", opts:[[30,"30 sn"],[60,"1 dk"],[300,"5 dk"],[900,"15 dk"]]},
  {key:"dim", label:"Karartma", opts:[[0,"Kapalı"],[.15,"Hafif"],[.3,"Orta"],[.45,"Güçlü"]]},
  {act:"photos", label:"Kendi fotoğraflarını ekle"},
  {grp:"Ekran koruyucu"},
  {key:"idle", label:"Menüyü gizle", opts:[[20,"20 sn"],[45,"45 sn"],[120,"2 dk"],[0,"Hiçbir zaman"]]},
  {grp:"Sistem"},
  {act:"system", label:"Sistem ayarları"}
];
/* Cihazda dosya seçici yok: fotoğraf satırı yerine Home tuşu ayarı gösterilir */
if(NATIVE){ ROWS = ROWS.map(function(r){ return r.act === "photos" ? {act:"reload", label:"Fotoğrafları yenile"} : r; });
  ROWS.splice(ROWS.length - 1, 0, {act:"home", label:"Home tuşuyla aç"}); }
function sel(){ return ROWS.map(function(r,i){ return r.grp ? -1 : i; }).filter(function(i){ return i > -1; }); }
function optT(r){ for(var i=0;i<r.opts.length;i++) if(r.opts[i][0] === S[r.key]) return r.opts[i][1]; return r.opts[0][1]; }
var rowShift = 0;
function renderRows(){
  var f = sel()[focus.set];
  document.getElementById("rows").innerHTML = ROWS.map(function(r, i){
    if(r.grp) return '<div class="grp">'+r.grp+'</div>';
    var v = r.opts ? '<span class="ar">‹</span>'+optT(r)+'<span class="ar">›</span>' : (r.act === "photos" && userPhotos.length ? userPhotos.length+" fotoğraf" : (r.act === "reload" ? (BUNDLED.length ? BUNDLED.length+" fotoğraf" : "Fotoğraf yok") : ""));
    return '<div class="row'+(i===f?' focus':'')+'" data-s="'+i+'"><span>'+r.label+'</span><span class="v">'+v+'</span></div>';
  }).join("");
  /* Uzun listede odaklanan satırı görünür tut */
  var wrap = document.getElementById("rowsWrap"), rows = document.getElementById("rows"), fr = rows.querySelector(".row.focus");
  if(fr){
    var u = stage.getBoundingClientRect().width / 120, wh = wrap.clientHeight / u, top = fr.offsetTop / u, h = fr.offsetHeight / u;
    var total = rows.scrollHeight / u, cur = rowShift;
    if(top - cur < 3) cur = Math.max(0, top - 3);
    if(top + h - cur > wh - 2) cur = top + h - wh + 2;
    rowShift = Math.max(0, Math.min(cur, Math.max(0, total - wh + 1)));
    rows.style.transform = "translateY(" + (-rowShift) + "rem)";
  }
}

/* ---------- Odak ve kumanda ---------- */
var mode = "dock", focus = {dock:0, all:0, set:0}, picked = false, picking = false;
function paint(){
  var q = (mode === "all") ? "#grid .it" : "#dockIn .it", k = (mode === "all") ? focus.all : focus.dock;
  document.querySelectorAll(".it.focus,.it.picked").forEach(function(n){ n.classList.remove("focus","picked"); });
  var n = document.querySelectorAll(q)[k], lab = document.getElementById("dlabel");
  if(n && mode !== "set"){ n.classList.add("focus"); if(mode === "edit" && picked) n.classList.add("picked"); }
  if(n && (mode === "dock" || mode === "edit")){
    var s = stage.getBoundingClientRect(), u = s.width / 120, r = n.querySelector(".tl").getBoundingClientRect(), d = document.getElementById("dock").getBoundingClientRect();
    lab.textContent = n.querySelector(".lb").textContent;
    lab.style.left = ((r.left + r.width/2 - s.left) / u) + "rem"; lab.style.top = ((d.top - s.top) / u - 3.6) + "rem";
    lab.classList.add("on");
  } else lab.classList.remove("on");
}
function setMode(m){
  mode = m;
  document.getElementById("all").classList.toggle("on", m === "all");
  document.getElementById("settings").classList.toggle("on", m === "set");
  document.getElementById("scrim").classList.toggle("on", m === "all" || m === "set");
  document.body.classList.toggle("edit", m === "edit");
  if(m === "all") renderGrid(); else if(m === "set"){ renderRows(); paint(); } else renderDock();
  alignGlass();
}
var toastT;
function toast(t){ var el = document.getElementById("toast"); el.querySelector(".in").textContent = t; alignGlass(); el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove("on"); }, 2000); }
function launch(a){ if(NATIVE){ try{ NATIVE.launch(a.pkg); return; }catch(e){} } toast(a.label + " açılıyor"); }

function key(k){
  var n;
  if(mode === "dock" || mode === "edit"){
    n = mode === "edit" ? S.dock.length : dockItems().length;
    if(k === "left" || k === "right"){
      var to = Math.max(0, Math.min(n-1, focus.dock + (k === "left" ? -1 : 1)));
      if(mode === "edit" && picked && to !== focus.dock){ var p = S.dock.splice(focus.dock,1)[0]; S.dock.splice(to,0,p); save(); focus.dock = to; renderDock(); return; }
      focus.dock = to; return paint();
    }
    if(mode === "edit"){
      if(k === "ok"){ picked = !picked; return paint(); }
      if(k === "back"){ picked = false; setMode("dock"); return toast("Sıralama kaydedildi"); }
      return;
    }
    if(k === "ok"){ var a = dockItems()[focus.dock];
      if(a.pkg === "#all"){ focus.all = 0; return setMode("all"); }
      if(a.pkg === "#set"){ focus.set = 0; rowShift = 0; return setMode("set"); }
      return launch(a); }
    if(k === "menu"){ focus.set = 0; rowShift = 0; return setMode("set"); }
    if(k === "back") return goIdle();
    return;
  }
  if(mode === "all"){
    var c = 8, i = focus.all;
    if(k === "left") i--; else if(k === "right") i++; else if(k === "up") i -= c; else if(k === "down") i += c;
    else if(k === "ok") return picking ? togglePin(focus.all) : launch(apps[focus.all]);
    else if(k === "back"){ var was = picking; picking = false; document.body.classList.remove("picking"); setMode("dock"); if(was) toast("Alt şerit güncellendi"); return; }
    else if(k === "menu") return togglePin(focus.all);
    if(i >= 0 && i < apps.length){ focus.all = i; paint(); }
    return;
  }
  if(mode === "set"){
    var list = sel(), r = ROWS[list[focus.set]];
    if(k === "up") focus.set = Math.max(0, focus.set-1);
    else if(k === "down") focus.set = Math.min(list.length-1, focus.set+1);
    else if(k === "back") return setMode("dock");
    else if((k === "left" || k === "right" || k === "ok") && r.opts){
      var cur = 0; r.opts.forEach(function(o, m){ if(o[0] === S[r.key]) cur = m; });
      cur = (cur + (k === "left" ? -1 : 1) + r.opts.length) % r.opts.length; S[r.key] = r.opts[cur][0]; save(); apply();
    }
    else if(k === "ok"){
      if(r.act === "photos") document.getElementById("files").click();
      else if(r.act === "pick"){ picking = true; focus.all = 0; return setMode("all"); }
      else if(r.act === "edit"){ focus.dock = 0; picked = false; return setMode("edit"); }
      else if(r.act === "reload"){ location.reload(); return; }
      else if(r.act === "home"){ try{ NATIVE.openAccessibilitySettings(); }catch(e){} }
      else if(r.act === "system"){ if(NATIVE){ try{ NATIVE.openSystemSettings(); }catch(e){} } else toast("Sistem ayarları açılıyor"); }
    }
    return renderRows();
  }
}
function apply(){ document.getElementById("dim").style.opacity = S.dim; startPhotos(); resetIdle(); if(mode === "dock") renderDock(); }

var idleT, idle = false;
function goIdle(){ if(mode !== "dock") return; idle = true; document.body.classList.add("idle"); }
function resetIdle(){ clearTimeout(idleT); if(S.idle > 0) idleT = setTimeout(goIdle, S.idle*1000); }
function wake(){ if(idle){ idle = false; document.body.classList.remove("idle"); resetIdle(); return true; } resetIdle(); return false; }

var KM = {ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down", Enter:"ok", Escape:"back", Backspace:"back", m:"menu", M:"menu", ContextMenu:"menu"};
var CM = {23:"ok", 4:"back", 82:"menu"};
document.addEventListener("keydown", function(e){ var k = KM[e.key] || CM[e.keyCode]; if(!k) return; e.preventDefault(); if(wake()) return; key(k); });
document.addEventListener("click", function(e){
  if(wake()) return;
  var it = e.target.closest(".it"), row = e.target.closest(".row");
  if(row){ focus.set = sel().indexOf(+row.getAttribute("data-s")); key("ok"); return; }
  if(!it) return; var i = +it.getAttribute("data-i");
  if(mode === "all") focus.all = i; else focus.dock = i; paint(); key("ok");
});
document.addEventListener("mousemove", function(){ wake(); });
window.seansBack = function(){ if(wake()) return; key("back"); };
window.seansKey = function(k){ if(wake()) return; key(k); };
window.seansHome = function(){ wake(); picked = false; focus.dock = 0; setMode("dock"); };

document.getElementById("files").addEventListener("change", function(e){
  var f = Array.prototype.slice.call(e.target.files || []); if(!f.length) return;
  f.forEach(function(x){ userPhotos.push({url:URL.createObjectURL(x), caption:x.name.replace(/\.[^.]+$/,"")}); });
  showPhoto(userPhotos.length - f.length); startPhotos(); renderRows(); toast(f.length + " fotoğraf eklendi");
});

/* ---------- Başlat ---------- */
var q = /scene=(\d)/.exec(location.search);
showPhoto(q ? +q[1] : 0);
tick(); setInterval(tick, 1000);
weather(); setInterval(weather, 30*60*1000);
renderDock(); apply();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(alignGlass);
})();
</script>
</body>

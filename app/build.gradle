plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.seans.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.seans.launcher'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

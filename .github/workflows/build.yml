name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: İmza anahtarını hazırla (secrets tanımlıysa)
        env:
          KS: ${{ secrets.SEANS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/seans.keystore; echo "Sabit imza kullanılıyor"; else echo "Secrets yok: geçici imza kullanılacak"; fi

      - name: APK oluştur
        env:
          SEANS_KEY_PASSWORD: ${{ secrets.SEANS_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle (Actions sekmesinde indirilebilir)
        uses: actions/upload-artifact@v4
        with:
          name: seans-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Son sürüm yayınını güncelle (projektörden doğrudan indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk seans.apk
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum seans.apk --title "Seans — son sürüm" --notes "Otomatik derleme: ${GITHUB_SHA::7}" --latest
